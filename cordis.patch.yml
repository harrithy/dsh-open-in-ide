# Open file references from the chat output in the chosen IDE (VS Code by default).
#
# A click on a file-reference chip in an assistant message opens that file in
# the IDE picked in Settings → General at the referenced line; Alt-click keeps
# the shipped in-app preview. The IDE selector stores the choice in the browser.
#
# Supported families (auto-detected on the host):
#   VS Code family (--goto): vscode | vscode-insiders | cursor | windsurf
#   JetBrains family (--line): idea | pycharm | webstorm | goland | clion |
#                              phpstorm | rider | rubymine | datagrip | rustrover
#
# Override this row in the profile's own cordis.patch.yml to change behavior:
#
#   - id: open-in-ide
#     config:
#       command: 'C:\Users\me\AppData\Local\Programs\Microsoft VS Code\bin\code.cmd'
#       commandKind: vscode
#       reuseWindow: true
- insert:
    - id: open-in-ide
      name: 'dsh-open-in-ide'
      config:
        # Explicit editor CLI: a bare PATH name or an absolute path. When set it
        # wins over the Settings selector; empty keeps the selector authoritative.
        command: ''
        # Launcher contract for a configured command: vscode (--goto) or
        # jetbrains (--line). Ignored while command is empty.
        commandKind: vscode
        # Fallback IDE when the browser sends no choice; any supported id.
        editor: vscode
        # Add --reuse-window so the file opens in the most recent window
        # (VS Code family only).
        reuseWindow: false
        # Extra arguments placed before the target arguments.
        extraArgs: []
        # Early-failure watch window for the detached launcher, in milliseconds.
        launchWatchMs: 2000
